###################################################
# Eggd MultiQC Configuration File for ATLAS
###################################################

# This file can be saved either in the MultiQC installation
# directory, or as ~/.multiqc_config.yaml

# Configuration settings are taken from the following locations, in order:
# - Hardcoded in MultiQC (multiqc/utils/config.py)
# - <installation_dir>/multiqc_config.yaml
# - ~/.multiqc_config.yaml
# - Command line options

# Note that all of the values below are set to the MultiQC defaults.
# It's recommended that you delete any that you don't need.

#################################################################

# Title to use for the report.
title: East GLH MultiQC Report
subtitle: ATLAS           # Grey text below title
# intro_text: null          # Set to False to remove, or your own text

# # Add generic information to the top of reports
# report_header_info:
#     - Example Config:: 'This is arbitrary'
#     - Another field:: 'Loaded from <code>multiqc_config_example.yaml</code>'
#     - Something different:: 'You can put any key-value pairs here'
#     - Want to know more?: 'See the <a href="http://multiqc.info/docs" target="_blank">MultiQC docs</a>'
# # Specify a custom logo to add to reports (uncomment to use)
# custom_logo: 'link to egglogo.png'         # '/path/to/logo.png'
# custom_logo_url: 'https://cuhbioinformatics.atlassian.net/servicedesk/customer/portal/3'     # 'https://www.example.com'
# custom_logo_title: 'Bioinformatics Help Desk'   # 'Our Institute Name'

# Default output filenames
output_fn_name: multiqc_report.html
data_dir_name: multiqc_data

# Prepend sample names with their directory. Useful if analysing the
# sample samples with different parameters.
prepend_dirs: False
# Whether to create the parsed data directory in addition to the report
make_data_dir: True

# Cleaning options for sample names. Typically, sample names are detected
# from an input filename. If any of these strings are found, they and any
# text to their right will be discarded.
# For example - file1.fq.gz_trimmed.bam_deduplicated_fastqc.zip
# would be cleaned to 'file1'
# Two options here - fn_clean_exts will replace the defaults,
# extra_fn_clean_exts will append to the defaults
extra_fn_clean_exts:
    - type: remove
      pattern: '_001'
    - type: remove
      pattern: '.markdup'
    - type: remove
      pattern: '_markdup'
    - type: remove
      pattern: '.realigned'
    - type: remove
      pattern: '_metrics'
    - type: remove
      pattern: '.dedup_metrics'
    - type: remove
      pattern: '.Duplication'
    - type: remove
      pattern: '.duplication'
    - type: remove
      pattern: '.AlignmentStat'
    - type: remove
      pattern: '.GCBias'
    - type: remove
      pattern: '.MeanQualityByCycle_metrics'
    - type: remove
      pattern: '.QualDistribution_metrics'
    - type: remove
      pattern: '_sorted'
    - type: remove
      pattern: '_unsorted'
    - type: remove
      pattern: '.insert_size'   


# Ignore files larger than this when searcing for logs (bytes)
log_filesize_limit: 5000000000
# MultiQC skips a couple of debug messages when searching files as the
# log can get very verbose otherwise. Re-enable here to help debugging.
report_readerrors: 0
# Opt-out of remotely checking that you're running the latest version
no_version_check: False

# How to plot graphs. Different templates can override these settings, but
# the default template can use interactive plots (Javascript using HighCharts)
# or flat plots (images, using MatPlotLib). With interactive plots, the report
# can prevent automatically rendering all graphs if there are lots of samples
# to prevent the browser being locked up when the report opens.
plots_force_flat: False          # Try to use only flat image graphs
plots_force_interactive: False   # Try to use only interactive javascript graphs
plots_flat_numseries: 260        # If neither of the above, use flat if > this number of datasets
plots_number_of_series_to-defer_loading: 100      # If interactive, don't plot on load if > this number of datasets
max_table_rows: 500              # Swap tables for a beeswarm plot above this

# Since Sentieon has been absorbed into Picard module, this is required
use_filename_as_sample_name:
    - picard/alignment_metrics
    - picard/markdups
    - picard/gcbias
    - picard/pcr_metrics
    - picard/insertsize
    - picard/quality_by_cycle
    - picard/quality_score_distribution

module_order:
    - 'custom_content'
    - sompy
    - verifybamid:
        extra: ""
    - picard
    - samtools
    - fastqc
    - bcl2fastq
    - interop

report_section_order:
    general_stats:
        order: 10000
    sompy:
        order: 9990
    sex_check:
        order: 9980
    samplesheet_samplename_patterns:
        order: 10

table_columns_visible:
    custom_coverage:
        200x: False
        300x: False
        500x: False
        1000x: False
    verifyBAMID:
        CHIPMIX: False
    Picard:
        #PERCENT_DUPLICATION: False
        PCT_TARGET_BASES_100X: False
        TOTAL_READS: False
        PCT_PF_READS_ALIGNED: False
        MEDIAN_TARGET_COVERAGE: False
        FOLD_ENRICHMENT: False
        ESTIMATED_LIBRARY_SIZE: True
    FastQC: False
    bcl2fastq: False

table_columns_placement:
    general_stats_table:
        mapped_passed: 930
        FREEMIX: 940
        picard_mark_duplicates-PERCENT_DUPLICATION: 946
        picard_mark_duplicates-ESTIMATED_LIBRARY_SIZE: 947
        250x: 950
        summed_median: 960
        PCT_AMPLIFIED_BASES: 970
        Usable_unique_bases_on_target: 980

picard_config:
    general_stats_target_coverage:
        - 100

custom_plot_config:
    picard_gcbias_plot:
        yCeiling: 5000
    samtools-flagstat-table:
        no_violin: True
    samtools-flagstat-pct-table:
        no_violin: True

custom_table_header_config:
    general_stats_table:
        custom_content_custom_coverage-500x:
            hidden: True
        custom_content_custom_coverage-1000x:
            hidden: True
        picard_hsmetrics-FOLD_ENRICHMENT:
            hidden: True
        picard_hsmetrics-MEDIAN_TARGET_COVERAGE:
            hidden: True
        picard_hsmetrics-picard_target_bases_100X:
            hidden: True
        picard_variantcallingmetrics-DBSNP_TITV:
            hidden: True
        picard_variantcallingmetrics-NOVEL_TITV:
            hidden: True
        picard_mark_duplicates-PERCENT_DUPLICATION:
            title: '% Duplication (UMI Dedup)'
            description: 'Duplication rate from Sentieon Dedup with UMI-aware LocusCollector (Duplication_metrics.txt)'
            max: 100
            min: 0
            suffix: '%'
        picard_mark_duplicates-ESTIMATED_LIBRARY_SIZE:
            title: 'Est. Library Size (UMI Dedup)'
            description: 'Estimated library size from Sentieon Dedup with UMI-aware LocusCollector'
            hidden: False
    picard_variantcallingmetrics_table:
        variantcallingmetrics-HET_HOMVAR_RATIO:
            hidden: True

table_cond_formatting_colours:
    - blue: '#337ab7'
    - lbue: '#5bc0de'
    - pass: '#5cb85c'
    - warn: '#f0ad4e'
    - fail: '#d9534f'

# Thresholds removed but placeholders kept
table_cond_formatting_rules:
    # Columns in the General Statistics table
    custom_content_custom_coverage-250x:
        pass:
            - lt: 101
        warn:
            - eq: 90.0
            - lt: 90.0
    verifybamid-FREEMIX: #verifyBamId Contaminntion column in General Stats
        pass:
            - lt: 10
        warn:
            - eq: 10
            - gt: 10
    picard_insertsizemetrics-summed_median: # Picard Median Insert Size
        pass:
            - gt: 150
        warn:
            - eq: 150
            - lt: 150
    hsmetrics-FOLD_80_BASE_PENALTY: # Picard HSMetrics fold 80 base penalty column
        pass:
            - lt: 1.80
        warn:
            - eq: 1.80
            - gt: 1.80

custom_data:
    custom_coverage:
        file_format: 'csv'
        plot_type: 'generalstats'
        pconfig:
            - 200x:
                description: 'Target bases coverage at custom depth'
                title: '%coverage at 200x'
                max: 100
                min: 0
                suffix: '%'
            - 250x:
                description: 'Target bases coverage at custom depth'
                title: '%coverage at 250x'
                max: 100
                min: 0
                suffix: '%'
            - 300x:
                description: 'Target bases coverage at custom depth'
                title: '%coverage at 300x'
                max: 100
                min: 0
                suffix: '%'
            - 500x:
                description: 'Target bases coverage at custom depth'
                title: '%coverage at 500x'
                max: 100
                min: 0
                suffix: '%'
            - 1000x:
                description: 'Target bases coverage at custom depth'
                title: '%coverage at 1000x'
                max: 100
                min: 0
                suffix: '%'
            - Usable unique bases on-target:
                description: 'Percentage of unique bases on target'
                title: '% Usable unique bases on-target'
                max: 100
                min: 0
                suffix: '%'
    samplesheet_wells:
        file_format: 'tsv'
        plot_type: 'generalstats'
        headers:
            well_column:
                title: 'well column'
            well_row:
                title: 'well row'
    samplesheet_samplename_patterns:
        file_format: 'tsv'
        plot_type: 'table'
        headers:
            well:
                title: 'Well column / row'
            samplenames:
                title: 'Sample name patterns'
    umi_metrics:
        file_format: 'keyval'
        plot_type: 'generalstats'
        pconfig:
            - PERCENT_DUPLICATION:
                title: 'UMI duplication rate'
                description: 'UMI-aware duplication rate from Sentieon Dedup'
                max: 1
                min: 0
            - ESTIMATED_LIBRARY_SIZE:
                title: 'Est. Library Size (UMI Dedup)'
                description: 'Estimated library size from Sentieon UMI-aware Dedup'
                min: 0

